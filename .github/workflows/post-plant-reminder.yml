name: Post plant watering reminder

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  post-message:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post plant reminder message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_PLANT_CHANNEL_ID: ${{ secrets.SLACK_PLANT_CHANNEL_ID }}
          SLACK_PLANT_BROADCAST: ${{ vars.SLACK_PLANT_BROADCAST }}
          SLACK_PLANT_EMOJI: ${{ vars.SLACK_PLANT_EMOJI }}
          SLACK_PLANT_WATER_EMOJI: ${{ vars.SLACK_PLANT_WATER_EMOJI }}
        run: npm run send:plant
