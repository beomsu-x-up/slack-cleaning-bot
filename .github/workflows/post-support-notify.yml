name: Post support program notifications

on:
  schedule:
    - cron: '17 0 * * *' # 00:17 UTC = 09:17 KST (정시 혼잡 회피로 지연 최소화)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 스로틀링으로 다수 사이트가 25s 타임아웃 나도 job이 안 죽도록 여유
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Post support notifications
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SUPPORT_CHANNEL_ID: ${{ secrets.SLACK_SUPPORT_CHANNEL_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: npm run send:support
